apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-siem
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "homelab-siem.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.siem.replicaCount }}
  selector:
    matchLabels:
      app: homelab-siem
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homelab-siem
        {{- include "homelab-siem.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: siem
          image: "{{ .Values.siem.image.repository }}:{{ .Values.siem.image.tag }}"
          imagePullPolicy: {{ .Values.siem.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.siem.config.port }}
              protocol: TCP
            - name: syslog-udp
              containerPort: {{ .Values.siem.config.syslogPort }}
              protocol: UDP
          envFrom:
            - configMapRef:
                name: siem-config
          volumeMounts:
            - name: siem-data
              mountPath: /app/data
            - name: siem-logs
              mountPath: /app/logs
            - name: config-file
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.siem.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: siem-data
          persistentVolumeClaim:
            claimName: siem-db-pvc
        - name: siem-logs
          emptyDir: {}
        - name: config-file
          configMap:
            name: siem-config
            items:
              - key: config.json
                path: config.json
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
