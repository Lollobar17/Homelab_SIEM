version: "3.9"

services:
  siem:
    build:
      context: ..
      dockerfile: k8s/Dockerfile
    container_name: homelab-siem
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - siem-data:/app/data
      - siem-logs:/app/logs
    environment:
      FLASK_ENV: development
      SIEM_PORT: 5000
      SIEM_DB_PATH: /app/data/siem.db
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  siem-data:
    driver: local
  siem-logs:
    driver: local
