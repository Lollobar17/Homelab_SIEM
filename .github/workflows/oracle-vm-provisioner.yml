name: Oracle VM Provisioner

on:
  schedule:
    - cron: '0 * * * *'  # ogni ora
  workflow_dispatch:       # avvio manuale

jobs:
  provision:
    name: "Try to create Oracle VM"
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: |
          pip install oci-cli --quiet

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=eu-frankfurt-1" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Try all availability domains
        id: provision
        run: |
          IMAGE_ID="ocid1.image.oc1.eu-frankfurt-1.aaaaaaaab2msc7qxe4auh5mhnfqx746egseojithkvoe7fnqqzau67u7qhba"
          SUBNET_ID="ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaalwgnaesh2owkp4e7a7awhmcjdekw6jxzc6s3kkowvibpumynfx5a"
          COMPARTMENT_ID="${{ secrets.OCI_TENANCY_OCID }}"
          SSH_KEY="${{ secrets.OCI_SSH_PUBLIC_KEY }}"

          for AD in "lGgl:EU-FRANKFURT-1-AD-1" "lGgl:EU-FRANKFURT-1-AD-2" "lGgl:EU-FRANKFURT-1-AD-3"; do
            echo "Trying $AD..."
            RESULT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD" \
              --display-name "homelab-siem" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --ssh-authorized-keys-file <(echo "$SSH_KEY") \
              --boot-volume-size-in-gbs 50 \
              2>&1 || true)

            if echo "$RESULT" | grep -q '"id"'; then
              echo "VM CREATED in $AD!"
              PUBLIC_IP=$(echo "$RESULT" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)['data']
          print('Instance ID:', data['id'])
          " || true)
              echo "$PUBLIC_IP"
              echo "vm_created=true" >> $GITHUB_OUTPUT
              exit 0
            elif echo "$RESULT" | grep -qi "out of capacity\|OutOfCapacity"; then
              echo "$AD: out of capacity"
            else
              echo "$AD: error — $(echo "$RESULT" | head -5)"
            fi
          done

          echo "vm_created=false" >> $GITHUB_OUTPUT
          echo "All ADs exhausted this run."

      - name: Notify success
        if: steps.provision.outputs.vm_created == 'true'
        run: |
          echo "### Oracle VM Created!" >> $GITHUB_STEP_SUMMARY
          echo "Check Oracle Cloud console for the public IP." >> $GITHUB_STEP_SUMMARY
