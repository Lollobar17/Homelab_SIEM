apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: homelab-siem
  namespace: homelab-siem
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - homelab-siem
  selector:
    matchLabels:
      app.kubernetes.io/name: homelab-siem
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
