# ──────────────────────────────────────────────────────────────────────────────
#  monitoring/prometheus-scrape-config.yaml
#  Custom scrape configuration for HomeLab SIEM metrics
#
#  Apply with:
#  kubectl apply -f monitoring/prometheus-scrape-config.yaml
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-siem-scrape
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-siem
    app.kubernetes.io/component: monitoring
data:
  siem-scrape.yml: |
    scrape_configs:
      - job_name: 'homelab-siem'
        static_configs:
          - targets: ['siem-service.homelab-siem.svc.cluster.local:80']
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: 'homelab-siem'
