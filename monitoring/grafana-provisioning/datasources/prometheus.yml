# ──────────────────────────────────────────────────────────────────────────────
#  monitoring/grafana-provisioning/datasources/prometheus.yml
#  Auto-configures Prometheus as Grafana datasource on startup
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
