name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/homelab-siem
  COLLECTOR_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/falco-collector
  NAMESPACE: homelab-siem

jobs:
  ci:
    name: "CI — Lint & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installa dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint con flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Esegui test
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short --cov=siem --cov-report=term-missing
          else
            echo "Smoke test minimale"
            python -c "import app; print('Import app.py OK')"
            python -c "from siem import collector, detector, storage; print('Import moduli SIEM OK')"
          fi

  build-push:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    outputs:
      sha-tag: ${{ steps.vars.outputs.sha }}

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Set short SHA (per rollout deterministico)
        id: vars
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker metadata (SIEM)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Docker metadata (Falco collector)
        id: meta-collector
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.COLLECTOR_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push SIEM
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./k8s/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e Push Falco collector
        uses: docker/build-push-action@v6
        with:
          context: ./scripts
          file: ./scripts/Dockerfile.falco-collector
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-collector.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Riepilogo build
        run: |
          echo "### Docker Images pubblicate" >> $GITHUB_STEP_SUMMARY
          echo "**SIEM:** \`${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Falco collector:** \`${{ env.COLLECTOR_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: "Deploy -> k3s Rolling Update"
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync manifest e rolling update immagine
        env:
          SHA_TAG: ${{ needs.build-push.outputs.sha-tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << EOF
            set -e
            export KUBECONFIG=/home/ubuntu/.kube/config
            cd ~/Homelab_SIEM
            git fetch origin main
            git reset --hard origin/main

            kubectl apply -f k8s/manifests/
            kubectl apply -f k8s/falco-collector.yaml

            kubectl set image deployment/homelab-siem \
              siem=${{ env.IMAGE_NAME }}:$SHA_TAG \
              -n ${{ env.NAMESPACE }}
            kubectl set image deployment/falco-collector \
              falco-collector=${{ env.COLLECTOR_IMAGE_NAME }}:$SHA_TAG \
              -n ${{ env.NAMESPACE }}

            kubectl rollout status deployment/homelab-siem -n ${{ env.NAMESPACE }} --timeout=180s
            kubectl rollout status deployment/falco-collector -n ${{ env.NAMESPACE }} --timeout=60s
          EOF

      - name: Rollback automatico in caso di fallimento
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'EOF'
            export KUBECONFIG=/home/ubuntu/.kube/config
            echo "Deploy fallito, rollback in corso..."
            kubectl rollout undo deployment/homelab-siem -n homelab-siem
            kubectl rollout status deployment/homelab-siem -n homelab-siem --timeout=60s
          EOF

      - name: Health check post-deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'EOF'
            export KUBECONFIG=/home/ubuntu/.kube/config
            sleep 15
            POD=$(kubectl get pod -n homelab-siem -l app=homelab-siem -o jsonpath='{.items[0].metadata.name}')
            kubectl exec -n homelab-siem "$POD" -- \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')" \
              && echo "Health check OK" || (echo "Health check FALLITO" && exit 1)
          EOF

      - name: Riepilogo deploy
        if: success()
        run: |
          echo "### Deploy completato" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** \`${{ env.NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag deployato:** \`${{ needs.build-push.outputs.sha-tag }}\`" >> $GITHUB_STEP_SUMMARY
