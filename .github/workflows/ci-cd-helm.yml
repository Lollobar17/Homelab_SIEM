name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/homelab-siem
  COLLECTOR_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/falco-collector
  NAMESPACE: homelab-siem

jobs:
  ci:
    name: "CI — Lint & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installa dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint con flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Esegui test
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short --cov=siem --cov-report=term-missing
          else
            echo "Smoke test minimale"
            python -c "import app; print('Import app.py OK')"
            python -c "from siem import collector, detector, storage; print('Import moduli SIEM OK')"
          fi

  purple-team-lab:
    name: "Purple Team Lab — Build & Behavioral Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Installa Nim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nim

      - name: Build agente Go
        run: |
          cd agent
          go build ./...

      - name: Compila runner Nim (loader offuscato XOR)
        run: |
          cd purple-team/nim-loaders
          nim c -d:release --hints:off -o:loader_test loader.nim

      - name: "Verifica analisi statica: 'uname' non deve essere in chiaro"
        run: |
          cd purple-team/nim-loaders
          if strings loader_test | grep -qi "uname"; then
            echo "::error::Stringa 'uname' trovata in chiaro nel binario"
            exit 1
          fi

      - name: "Verifica analisi dinamica: il comando deve eseguire correttamente"
        run: |
          cd purple-team/nim-loaders
          OUTPUT=$(./loader_test)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -qi "linux"; then
            echo "::error::Output inatteso"
            exit 1
          fi

  release-agent-binaries:
    name: "Release — Cross-compile Go Agent"
    runs-on: ubuntu-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compila per linux/amd64 e linux/arm64
        run: |
          cd agent
          mkdir -p ../dist
          for arch in amd64 arm64; do
            echo "=== build linux/$arch ==="
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o ../dist/purple-agent-linux-$arch ./cmd
          done

      - name: Verifica che i binari siano statici
        run: |
          cd dist
          for f in purple-agent-linux-*; do
            file "$f"
            file "$f" | grep -q "statically linked" || { echo "::error::$f non e' statico"; exit 1; }
          done

      - name: Genera checksum SHA256
        run: |
          cd dist
          sha256sum purple-agent-linux-* > checksums.txt

      - name: Pubblica su GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/purple-agent-linux-amd64
            dist/purple-agent-linux-arm64
            dist/checksums.txt
          generate_release_notes: true

  nim-purple-team-lab:
    name: "Nim Purple Team Lab — Build, Test & Integrazione SIEM"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Installa Nim
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nim

      - name: Verifica versioni Nim/Nimble
        run: |
          nim --version
          nimble --version

      - name: Nimble install (dipendenze)
        working-directory: purple-team/nim
        run: nimble install -y --depsOnly

      - name: Nimble build
        working-directory: purple-team/nim
        run: nimble build -y

      - name: Nimble test (intera suite, ricompila anche i fixture binari)
        working-directory: purple-team/nim
        run: nimble test -y

      - name: Avvia mock ingress SIEM per il test di integrazione
        working-directory: purple-team/nim
        run: |
          cat > /tmp/mock_ingress.py << 'MOCKEOF'
          import http.server, json

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length)
                  json.loads(body)  # fallisce con eccezione se il JSON e' malformato
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'"'"'{"status":"ok"}'"'"')

              def log_message(self, *args):
                  pass

          http.server.HTTPServer(("127.0.0.1", 5000), Handler).serve_forever()
          MOCKEOF
          nohup python3 /tmp/mock_ingress.py > /tmp/mock_ingress.log 2>&1 &
          sleep 1

      - name: "Round-trip reale: main --send -> mock ingress SIEM"
        working-directory: purple-team/nim
        env:
          SIEM_INGEST_URL: "http://127.0.0.1:5000/api/v1/ingress"
          SIEM_AGENT_TOKEN: "ci-test-token"
        run: ./main --send

      - name: Test Python delle regole di detection per la telemetria Nim
        run: |
          pip install --break-system-packages -q pytest
          pytest tests/test_nim_lab_rules.py tests/test_correlation_rules.py -v

  build-push:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    outputs:
      sha-tag: ${{ steps.vars.outputs.sha }}

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Set short SHA (per rollout deterministico)
        id: vars
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Docker metadata (SIEM)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Docker metadata (Falco collector)
        id: meta-collector
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.COLLECTOR_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push SIEM
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./k8s/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e Push Falco collector
        uses: docker/build-push-action@v6
        with:
          context: ./scripts
          file: ./scripts/Dockerfile.falco-collector
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-collector.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Riepilogo build
        run: |
          echo "### Docker Images pubblicate" >> $GITHUB_STEP_SUMMARY
          echo "**SIEM:** \`${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Falco collector:** \`${{ env.COLLECTOR_IMAGE_NAME }}:${{ steps.vars.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: "Deploy -> k3s via Helm"
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - name: Configura SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repo e helm upgrade
        env:
          SHA_TAG: ${{ needs.build-push.outputs.sha-tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << EOF
            set -e
            export KUBECONFIG=/home/ubuntu/.kube/config
            cd ~/Homelab_SIEM
            git fetch origin main
            git reset --hard origin/main

            helm upgrade homelab-siem k8s/homelab-siem-chart \
              -n ${{ env.NAMESPACE }} \
              --set namespace.name=${{ env.NAMESPACE }} \
              --set siem.image.tag=$SHA_TAG \
              --set falcoCollector.image.tag=$SHA_TAG \
              --wait --timeout 180s
          EOF

      - name: Rollback automatico in caso di fallimento
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'EOF'
            export KUBECONFIG=/home/ubuntu/.kube/config
            echo "Deploy fallito, rollback in corso..."
            helm rollback homelab-siem -n homelab-siem
            kubectl rollout status deployment/homelab-siem -n homelab-siem --timeout=60s
          EOF

      - name: Health check post-deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash -s << 'EOF'
            export KUBECONFIG=/home/ubuntu/.kube/config
            sleep 15
            POD=$(kubectl get pod -n homelab-siem -l app=homelab-siem -o jsonpath='{.items[0].metadata.name}')
            kubectl exec -n homelab-siem "$POD" -- \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')" \
              && echo "Health check OK" || (echo "Health check FALLITO" && exit 1)
          EOF

      - name: Riepilogo deploy
        if: success()
        run: |
          echo "### Deploy completato via Helm" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** \`${{ env.NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag deployato:** \`${{ needs.build-push.outputs.sha-tag }}\`" >> $GITHUB_STEP_SUMMARY
