name: Oracle VM Provisioner

on:
  schedule:
    - cron: '14,44 * * * *'
  workflow_dispatch:

jobs:
  provision:
    name: "Try to create Oracle VM"
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=eu-frankfurt-1" >> ~/.oci/config
          echo "key_file=/home/runner/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config
        env:
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

      - name: Try all availability domains (Multiple Loops)
        id: provision
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          IMAGE_ID="ocid1.image.oc1.eu-frankfurt-1.aaaaaaaab2msc7qxe4auh5mhnfqx746egseojithkvoe7fnqqzau67u7qhba"
          SUBNET_ID="ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaalwgnaesh2owkp4e7a7awhmcjdekw6jxzc6s3kkowvibpumynfx5a"
          COMPARTMENT_ID="${{ secrets.OCI_TENANCY_OCID }}"
          SSH_KEY="${{ secrets.OCI_SSH_PUBLIC_KEY }}"
          
          NUM_ATTEMPTS=10
          SLEEP_TIME=30

          for i in $(seq 1 $NUM_ATTEMPTS); do
            echo "=========================================="
            echo "  INIZIO TENTATIVO REALE DEL RUN: $i di $NUM_ATTEMPTS"
            echo "=========================================="
            
            for AD in "lGgl:EU-FRANKFURT-1-AD-1" "lGgl:EU-FRANKFURT-1-AD-2" "lGgl:EU-FRANKFURT-1-AD-3"; do
              echo "Provando in $AD..."
              RESULT=$(oci compute instance launch \
                --compartment-id "$COMPARTMENT_ID" \
                --availability-domain "$AD" \
                --display-name "homelab-siem" \
                --shape "VM.Standard.A1.Flex" \
                --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
                --image-id "$IMAGE_ID" \
                --subnet-id "$SUBNET_ID" \
                --assign-public-ip true \
                --ssh-authorized-keys-file <(echo "$SSH_KEY") \
                --boot-volume-size-in-gbs 50 \
                2>&1 || true)

              if echo "$RESULT" | grep -q '"id"'; then
                echo "!!! VM CREATA CON SUCCESSO in $AD !!!"
                INSTANCE_ID=$(echo "$RESULT" | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['id'])" || true)
                echo "Instance ID: $INSTANCE_ID"
                echo "vm_created=true" >> $GITHUB_OUTPUT
                echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
                exit 0
              elif echo "$RESULT" | grep -qi "out of capacity\|OutOfCapacity\|InternalError"; then
                echo "$AD: Out of capacity."
              else
                echo "$AD: Errore imprevisto — $(echo "$RESULT" | grep message | head -1)"
              fi
            done
            
            if [ $i -lt $NUM_ATTEMPTS ]; then
              echo "Nessun AD disponibile nel tentativo $i. Attendo $SLEEP_TIME secondi..."
              sleep $SLEEP_TIME
            fi
          done

          echo "vm_created=false" >> $GITHUB_OUTPUT
          echo "Tutti i $NUM_ATTEMPTS tentativi sono falliti per mancanza di risorse."

      - name: Notify success
        if: steps.provision.outputs.vm_created == 'true'
        run: |
          echo "### Oracle VM Created!" >> $GITHUB_STEP_SUMMARY
          echo "**Instance ID:** \`${{ steps.provision.outputs.instance_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Controlla la console Oracle Cloud per l'IP pubblico." >> $GITHUB_STEP_SUMMARY
