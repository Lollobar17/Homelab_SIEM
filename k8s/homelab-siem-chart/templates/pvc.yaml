apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siem-db-pvc
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "homelab-siem.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.siem.storage.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.siem.storage.size }}
