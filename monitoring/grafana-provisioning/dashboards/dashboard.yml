# ──────────────────────────────────────────────────────────────────────────────
#  monitoring/grafana-provisioning/dashboards/dashboard.yml
#  Auto-loads SIEM dashboard on Grafana startup
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: 1

providers:
  - name: 'HomeLab SIEM'
    orgId: 1
    folder: 'SIEM'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
