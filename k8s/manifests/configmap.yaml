apiVersion: v1
kind: ConfigMap
metadata:
  name: siem-config
  namespace: homelab-siem
  labels:
    app.kubernetes.io/name: homelab-siem
    app.kubernetes.io/component: config
data:
  config.json: |
    {
      "syslog_enabled": true,
      "syslog_port": 5140,
      "watch_files": [],
      "web_port": 5000
    }
  FLASK_ENV: "production"
  SIEM_PORT: "5000"
  SIEM_DB_PATH: "/app/data/siem.db"
  PYTHONUNBUFFERED: "1"
