apiVersion: apps/v1
kind: Deployment
metadata:
  name: falco-collector
  namespace: homelab-siem
  labels:
    app.kubernetes.io/name: falco-collector
    app.kubernetes.io/component: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: falco-collector
  template:
    metadata:
      labels:
        app: falco-collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: falco-collector
          image: lollobar17/falco-collector:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 2801
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: falco-collector
  namespace: homelab-siem
  labels:
    app.kubernetes.io/name: falco-collector
spec:
  type: ClusterIP
  selector:
    app: falco-collector
  ports:
    - name: http
      port: 2801
      targetPort: http
      protocol: TCP
