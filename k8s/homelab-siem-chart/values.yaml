nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: homelab-siem

siem:
  image:
    repository: lollobar17/homelab-siem
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    flaskEnv: production
    port: 5000
    dbPath: /app/data/siem.db
    dbBackend: sqlite
    syslogEnabled: true
    syslogPort: 5140
  service:
    type: NodePort
    httpPort: 80
    httpNodePort: 30500
    syslogNodePort: 30514
  storage:
    size: 1Gi
    storageClassName: local-path
  hpa:
    # WARNING: only safe to scale beyond 1 replica when postgres.enabled=true.
    # With the sqlite backend, multiple pods writing to the same PVC file
    # concurrently risks database corruption, not just a handled error.
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    cpuTarget: 70
    memoryTarget: 80
  networkPolicy:
    enabled: true

falcoCollector:
  enabled: true
  image:
    repository: lollobar17/falco-collector
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

postgres:
  enabled: false
  image:
    repository: postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: siem
    username: siem
    password: ""
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi
  storage:
    size: 2Gi
    storageClassName: local-path

monitoring:
  serviceMonitor:
    enabled: true
    prometheusRelease: kube-prometheus-stack
    interval: 30s
  grafanaDashboard:
    enabled: true
