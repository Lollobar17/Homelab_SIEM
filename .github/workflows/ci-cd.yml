name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "develop/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/homelab-siem
  NAMESPACE: homelab-siem

jobs:
  ci:
    name: "CI — Lint & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installa dipendenze
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint con flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Esegui test
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short --cov=siem --cov-report=term-missing
          else
            echo "Smoke test minimale"
            python -c "import app; print('Import app.py OK')"
            python -c "from siem import collector, detector, storage; print('Import moduli SIEM OK')"
          fi

  build-push:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./k8s/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Riepilogo build
        run: |
          echo "### Docker Image pubblicata" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: "Deploy -> K8s Rolling Update"
    runs-on: self-hosted
    needs: build-push
    environment: production

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Rolling update immagine
        run: |
          IMAGE_WITH_TAG="${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.image-digest }}"
          echo "Aggiornamento a: $IMAGE_WITH_TAG"
          kubectl set image deployment/homelab-siem \
            siem="$IMAGE_WITH_TAG" \
            -n ${{ env.NAMESPACE }}

      - name: Attendi rollout
        run: |
          kubectl rollout status deployment/homelab-siem \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s

      - name: Rollback automatico in caso di fallimento
        if: failure()
        run: |
          echo "Deploy fallito, rollback in corso..."
          kubectl rollout undo deployment/homelab-siem -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/homelab-siem -n ${{ env.NAMESPACE }} --timeout=60s

      - name: Health check post-deploy
        run: |
          sleep 30
          POD=$(kubectl get pod -n ${{ env.NAMESPACE }} -l app=homelab-siem -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n ${{ env.NAMESPACE }} "$POD" -- \
            python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')" \
            && echo "Health check OK" || (echo "Health check FALLITO" && exit 1)

      - name: Riepilogo deploy
        if: success()
        run: |
          echo "### Deploy completato" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** \`${{ env.NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
