name: Oracle VM Provisioner

on:
  schedule:
    - cron: '14,44 * * * *'
  workflow_dispatch:

jobs:
  provision:
    name: "Try to create Oracle VM"
    runs-on: ubuntu-latest

    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_USER_OCID }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}" >> ~/.oci/config
          echo "region=eu-frankfurt-1" >> ~/.oci/config
          echo "key_file=/home/runner/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "${{ secrets.OCI_API_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config
        env:
          SUPPRESS_LABEL_WARNING: "True"
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

      - name: Try all availability domains (A1 direct, then A2 fallback + downgrade)
        id: provision
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          IMAGE_ID="ocid1.image.oc1.eu-frankfurt-1.aaaaaaaab2msc7qxe4auh5mhnfqx746egseojithkvoe7fnqqzau67u7qhba"
          SUBNET_ID="ocid1.subnet.oc1.eu-frankfurt-1.aaaaaaaalwgnaesh2owkp4e7a7awhmcjdekw6jxzc6s3kkowvibpumynfx5a"
          COMPARTMENT_ID="${{ secrets.OCI_TENANCY_OCID }}"
          SSH_KEY="${{ secrets.OCI_SSH_PUBLIC_KEY }}"

          TARGET_OCPUS=2
          TARGET_MEMORY_GB=12
          NUM_ATTEMPTS=10
          SLEEP_TIME=30
          ADS=("lGgl:EU-FRANKFURT-1-AD-1" "lGgl:EU-FRANKFURT-1-AD-2" "lGgl:EU-FRANKFURT-1-AD-3")

          # Write the SSH key to a real temp file instead of using process substitution.
          # Process substitution (<(...)) can fail on some CI runners because the OCI CLI
          # (Click-based) checks file existence and reads it in separate steps, which
          # doesn't always work with an ephemeral /dev/fd/N handle.
          # Also strip any embedded newlines from the secret (a common copy-paste artifact)
          # so the key ends up as a single clean line, since OCI validates the format strictly.
          SSH_KEY_FILE=$(mktemp)
          SSH_KEY_ONELINE=$(printf '%s' "$SSH_KEY" | tr -d '\r\n')
          printf '%s\n' "$SSH_KEY_ONELINE" > "$SSH_KEY_FILE"
          echo "SSH key file written, $(wc -l < "$SSH_KEY_FILE") line(s), $(wc -c < "$SSH_KEY_FILE") bytes."

          # ---- Helper: launch instance with a given shape, return instance id or empty ----
          launch_instance () {
            local SHAPE="$1"
            local AD="$2"
            oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD" \
              --display-name "homelab-siem" \
              --shape "$SHAPE" \
              --shape-config "{\"ocpus\": $TARGET_OCPUS, \"memoryInGBs\": $TARGET_MEMORY_GB}" \
              --image-id "$IMAGE_ID" \
              --subnet-id "$SUBNET_ID" \
              --assign-public-ip true \
              --ssh-authorized-keys-file "$SSH_KEY_FILE" \
              --boot-volume-size-in-gbs 50 \
              2>&1 || true
          }

          INSTANCE_ID=""
          FINAL_SHAPE=""

          for i in $(seq 1 $NUM_ATTEMPTS); do
            echo "=========================================="
            echo "  TENTATIVO $i di $NUM_ATTEMPTS"
            echo "=========================================="

            # --- Fase 1: prova A1.Flex diretto su tutti gli AD ---
            for AD in "${ADS[@]}"; do
              echo "[A1.Flex] Provando in $AD..."
              RESULT=$(launch_instance "VM.Standard.A1.Flex" "$AD")

              if echo "$RESULT" | grep -q '"id"'; then
                echo "!!! VM A1.Flex CREATA CON SUCCESSO in $AD !!!"
                INSTANCE_ID=$(echo "$RESULT" | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['id'])" || true)
                FINAL_SHAPE="VM.Standard.A1.Flex"
                break 2
              elif echo "$RESULT" | grep -qi "out of capacity\|OutOfCapacity\|InternalError"; then
                echo "[A1.Flex] $AD: Out of capacity."
              else
                echo "[A1.Flex] $AD: Errore imprevisto. Output completo:"
                echo "$RESULT"
              fi
            done

            # --- Fase 2: fallback su A2.Flex, poi downgrade a A1.Flex ---
            for AD in "${ADS[@]}"; do
              echo "[A2.Flex fallback] Provando in $AD..."
              RESULT=$(launch_instance "VM.Standard.A2.Flex" "$AD")

              if echo "$RESULT" | grep -q '"id"'; then
                A2_ID=$(echo "$RESULT" | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['id'])" || true)
                echo "!!! VM A2.Flex CREATA in $AD (OCID: $A2_ID). Avvio downgrade a A1.Flex... !!!"

                oci compute instance action --instance-id "$A2_ID" --action START --wait-for-state RUNNING || true

                UPDATE_RESULT=$(oci compute instance update \
                  --instance-id "$A2_ID" \
                  --shape "VM.Standard.A1.Flex" \
                  --shape-config "{\"ocpus\": $TARGET_OCPUS, \"memoryInGBs\": $TARGET_MEMORY_GB}" \
                  --wait-for-state RUNNING \
                  --force \
                  2>&1 || true)

                if echo "$UPDATE_RESULT" | grep -qi '"shape": "VM.Standard.A1.Flex"'; then
                  echo "!!! DOWNGRADE A A1.Flex RIUSCITO !!!"
                  INSTANCE_ID="$A2_ID"
                  FINAL_SHAPE="VM.Standard.A1.Flex (via A2.Flex)"
                else
                  echo "ATTENZIONE: istanza creata come A2.Flex ma il downgrade e' fallito."
                  echo "$UPDATE_RESULT" | grep message | head -1
                  echo "L'istanza resta A2.Flex (a pagamento, consuma credito Free Trial) - verifica manualmente in console."
                  INSTANCE_ID="$A2_ID"
                  FINAL_SHAPE="VM.Standard.A2.Flex (downgrade fallito, richiede intervento manuale)"
                fi
                break 2
              elif echo "$RESULT" | grep -qi "out of capacity\|OutOfCapacity\|InternalError"; then
                echo "[A2.Flex fallback] $AD: Out of capacity."
              else
                echo "[A2.Flex fallback] $AD: Errore imprevisto. Output completo:"
                echo "$RESULT"
              fi
            done

            if [ -n "$INSTANCE_ID" ]; then
              break
            fi

            if [ $i -lt $NUM_ATTEMPTS ]; then
              echo "Nessun AD disponibile (ne' A1 ne' A2) nel tentativo $i. Attendo $SLEEP_TIME secondi..."
              sleep $SLEEP_TIME
            fi
          done

          rm -f "$SSH_KEY_FILE"

          if [ -n "$INSTANCE_ID" ]; then
            echo "Instance ID: $INSTANCE_ID"
            echo "Shape finale: $FINAL_SHAPE"
            echo "vm_created=true" >> $GITHUB_OUTPUT
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
            echo "final_shape=$FINAL_SHAPE" >> $GITHUB_OUTPUT
          else
            echo "vm_created=false" >> $GITHUB_OUTPUT
            echo "Tutti i $NUM_ATTEMPTS tentativi sono falliti (A1 e A2) per mancanza di risorse."
          fi

      - name: Notify success
        if: steps.provision.outputs.vm_created == 'true'
        run: |
          echo "### Oracle VM Created!" >> $GITHUB_STEP_SUMMARY
          echo "**Instance ID:** \`${{ steps.provision.outputs.instance_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Shape finale:** \`${{ steps.provision.outputs.final_shape }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Controlla la console Oracle Cloud per l'IP pubblico e per confermare che lo shape sia effettivamente A1.Flex (Always Free)." >> $GITHUB_STEP_SUMMARY
