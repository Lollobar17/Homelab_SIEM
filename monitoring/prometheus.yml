# ──────────────────────────────────────────────────────────────────────────────
#  monitoring/prometheus.yml
#  Prometheus scrape configuration for HomeLab SIEM
# ──────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # ── HomeLab SIEM metrics ───────────────────────────────────────────────────
  - job_name: 'homelab-siem'
    static_configs:
      - targets: ['172.20.0.1:30500']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
