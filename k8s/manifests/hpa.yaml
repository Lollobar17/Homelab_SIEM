apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: siem-hpa
  namespace: homelab-siem
  labels:
    app.kubernetes.io/name: homelab-siem
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: homelab-siem
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
EOFcat > k8s/manifests/hpa.yaml << 'EOF'
